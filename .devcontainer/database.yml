# Database configuration for CryptKeeper development in Docker
# Copy this to spec/database.yml and adjust as needed

postgres:
  adapter: postgresql
  encoding: utf8
  reconnect: false
  database: crypt_keeper_providers
  pool: 5
  username: postgres
  password: deploy
  host: postgres  # Docker Compose service name
  port: 5432
  min_messages: WARNING

mysql:
  adapter: mysql2
  encoding: utf8
  reconnect: false
  database: crypt_keeper_providers
  pool: 5
  username: root
  password: deploy
  host: mysql  # Docker Compose service name
  port: 3306

sqlite:
  adapter: sqlite3
  encoding: utf8
  reconnect: false
  database: ':memory:'
