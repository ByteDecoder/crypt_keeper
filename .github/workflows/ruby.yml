name: Tests

on: [push, pull_request]

jobs:
  test:
    name: Test on Ruby ${{ matrix.ruby-version }} / Active Record ${{ matrix.rails }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["2.4", "2.5", "2.7", "3.0", "3.1", "3.2", "3.3", "3.4"]
        rails:
          ["4_2", "5_0", "5_1", "5_2", "6_0", "6_1", "7_0", "7_1", "7_2", "8_0", "8_1"]
        exclude:
          # Ruby 2.4-2.5 only support Rails 4.2-5.2
          - ruby-version: "2.4"
            rails: "5_0"
          - ruby-version: "2.4"
            rails: "5_1"
          - ruby-version: "2.4"
            rails: "5_2"
          - ruby-version: "2.4"
            rails: "6_0"
          - ruby-version: "2.4"
            rails: "6_1"
          - ruby-version: "2.4"
            rails: "7_0"
          - ruby-version: "2.4"
            rails: "7_1"
          - ruby-version: "2.4"
            rails: "7_2"
          - ruby-version: "2.4"
            rails: "8_0"
          - ruby-version: "2.4"
            rails: "8_1"
          - ruby-version: "2.5"
            rails: "6_0"
          - ruby-version: "2.5"
            rails: "6_1"
          - ruby-version: "2.5"
            rails: "7_0"
          - ruby-version: "2.5"
            rails: "7_1"
          - ruby-version: "2.5"
            rails: "7_2"
          - ruby-version: "2.5"
            rails: "8_0"
          - ruby-version: "2.5"
            rails: "8_1"
          # Ruby 2.7+ doesn't support Rails 4.2
          - ruby-version: "2.7"
            rails: "4_2"
          - ruby-version: "3.0"
            rails: "4_2"
          - ruby-version: "3.1"
            rails: "4_2"
          - ruby-version: "3.2"
            rails: "4_2"
          - ruby-version: "3.3"
            rails: "4_2"
          - ruby-version: "3.4"
            rails: "4_2"
          - ruby-version: "2.7"
            rails: "7_2"
          - ruby-version: "2.7"
            rails: "8_0"
          - ruby-version: "2.7"
            rails: "8_1"
          - ruby-version: "3.0"
            rails: "5_0"
          - ruby-version: "3.0"
            rails: "5_1"
          - ruby-version: "3.0"
            rails: "5_2"
          - ruby-version: "3.0"
            rails: "7_2"
          - ruby-version: "3.0"
            rails: "8_0"
          - ruby-version: "3.0"
            rails: "8_1"
          - ruby-version: "3.1"
            rails: "5_0"
          - ruby-version: "3.1"
            rails: "5_1"
          - ruby-version: "3.1"
            rails: "5_2"
          - ruby-version: "3.1"
            rails: "8_0"
          - ruby-version: "3.1"
            rails: "8_1"
          - ruby-version: "3.2"
            rails: "5_0"
          - ruby-version: "3.2"
            rails: "5_1"
          - ruby-version: "3.2"
            rails: "5_2"
          - ruby-version: "3.2"
            rails: "8_1"
          - ruby-version: "3.3"
            rails: "5_0"
          - ruby-version: "3.3"
            rails: "5_1"
          - ruby-version: "3.3"
            rails: "5_2"
          - ruby-version: "3.4"
            rails: "5_0"
          - ruby-version: "3.4"
            rails: "5_1"
          - ruby-version: "3.4"
            rails: "5_2"
          - ruby-version: "3.4"
            rails: "6_0"
          - ruby-version: "3.4"
            rails: "6_1"
          - ruby-version: "3.4"
            rails: "7_0"

    env:
      TESTING_RAILS_VERSION: ${{ matrix.rails }}

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: crypt_keeper
          POSTGRES_PASSWORD: crypt_keeper
          POSTGRES_DB: crypt_keeper_providers
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      mysql:
        image: mysql:5.7
        env:
          MYSQL_DATABASE: crypt_keeper_providers
          MYSQL_USER: crypt_keeper
          MYSQL_PASSWORD: crypt_keeper
          MYSQL_ROOT_PASSWORD: rootpassword
        ports:
          - 33306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup System
        run: sudo apt-get install libsqlite3-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Update Bundler
        run: |
          # Update RubyGems and Bundler based on Ruby version compatibility
          if [[ "${{ matrix.ruby-version }}" == "2.4" ]] || [[ "${{ matrix.ruby-version }}" == "2.5" ]]; then
            # Ruby 2.4-2.5: Use compatible older versions
            gem update --system 3.2.3
            gem install bundler -v '~> 2.3.0'
          elif [[ "${{ matrix.ruby-version }}" == "2.7" ]]; then
            # Ruby 2.7: RubyGems 3.4.22 is the last compatible version
            gem update --system 3.4.22
            gem install bundler -v '~> 2.4.0'
          elif [[ "${{ matrix.ruby-version }}" == "3.0" ]] || [[ "${{ matrix.ruby-version }}" == "3.1" ]]; then
            # Ruby 3.0-3.1: RubyGems 3.5.x is the last compatible version
            gem update --system 3.5.23
            gem install bundler
          else
            # Ruby >= 3.2: Use latest
            gem update --system
            gem install bundler
          fi

      - name: Install dependencies for this Rails version
        run: |
          # Generate appraisals and install only the one we need
          bundle exec appraisal generate

          # Check if this Rails version gemfile was generated (compatible with this Ruby)
          gemfile="gemfiles/activerecord_${{ matrix.rails }}.gemfile"
          if [ ! -f "$gemfile" ]; then
            echo "Gemfile $gemfile not found - incompatible Ruby/Rails combination"
            exit 1
          fi

          # Install dependencies for this specific appraisal
          echo "Installing dependencies for activerecord_${{ matrix.rails }}..."
          # First generate the lock file if it doesn't exist
          BUNDLE_GEMFILE="$PWD/gemfiles/activerecord_${{ matrix.rails }}.gemfile" bundle lock
          # Then install using the same path as main bundle
          BUNDLE_GEMFILE="$PWD/gemfiles/activerecord_${{ matrix.rails }}.gemfile" \
            bundle config set --local path 'vendor/bundle'
          BUNDLE_GEMFILE="$PWD/gemfiles/activerecord_${{ matrix.rails }}.gemfile" \
            bundle install --jobs 4 --retry 3

      - name: Copy database config
        run: |
          cp spec/github_actions.database.yml spec/database.yml

      - name: Enable pgcrypto extension
        run: |
          PGPASSWORD=crypt_keeper psql crypt_keeper_providers -h localhost -p 5432 -U crypt_keeper -tc "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      - name: Run tests
        run: bundle exec appraisal activerecord_${{ matrix.rails }} rake
